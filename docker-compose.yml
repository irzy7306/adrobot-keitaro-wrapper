services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adrobot
      POSTGRES_USER: adrobot
      POSTGRES_PASSWORD: adrobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adrobot -d adrobot"]
      interval: 3s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data:
